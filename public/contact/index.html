<!doctype html>
<meta charset="utf-8">
<title>Moved to /ask</title>
<!-- The server-side redirect this replaces cannot survive a static export, so
     the bounce happens here instead. canonical carries the signal for crawlers;
     the refresh and the link carry it for people, in that order, so it still
     works with JavaScript off. -->
<link rel="canonical" href="../ask/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=../ask/">
<p>This page moved to <a href="../ask/">/ask</a>.</p>
