name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # so a deploy can be re-run from the Actions tab without a new commit
  workflow_dispatch:

# Pages needs to be able to publish, and the job needs an OIDC token to do it.
permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static export
        # The repository name is the path the site is served from. Taking it
        # from the runner rather than hardcoding it means renaming the repo
        # does not silently break every asset URL.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
